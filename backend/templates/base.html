<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ show.title if show.title else "The Mentalist" }} · Databricks Explorer</title>
  <link rel="stylesheet" href="/static/css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Afacad:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600;1,700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-layout">
    <!-- LEFT SIDEBAR -->
    <aside class="sidebar">
      <div>
        <div class="sidebar-header">
          <button class="sidebar-toggle" title="Collapse sidebar" aria-label="Collapse sidebar">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
            </svg>
          </button>
        </div>
        <nav class="sidebar-nav">
          <a href="/" class="nav-item {% if current_page == 'home' %}active{% endif %}">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
            </svg>
            Home
          </a>
          <a href="/episodes" class="nav-item {% if current_page == 'episodes' %}active{% endif %}">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
            </svg>
            Episodes
          </a>
          <a href="/characters" class="nav-item {% if current_page == 'characters' %}active{% endif %}">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
            </svg>
            Characters
          </a>
          <a href="/awards" class="nav-item {% if current_page == 'awards' %}active{% endif %}">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/>
            </svg>
            Awards
          </a>
          <a href="/about" class="nav-item {% if current_page == 'about' %}active{% endif %}">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            About
          </a>
          <a href="/contact" class="nav-item {% if current_page == 'contact' %}active{% endif %}">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>
            Contact
          </a>
          <a href="/react/" class="nav-item" style="margin-top: 10px; border-left: 3px solid #C8102E; color: #C8102E; font-weight: 600;">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/>
            </svg>
            React 19 App
          </a>
        </nav>
      </div>

      <div class="sidebar-footer">
        Data from <a href="https://en.wikipedia.org/wiki/The_Mentalist" target="_blank">Wikipedia</a> (CC BY-SA) and <a href="https://www.imdb.com/title/tt1196946/" target="_blank">IMDb</a> (personal, non-commercial use).
      </div>
    </aside>

    <!-- MAIN BODY -->
    <div class="main-wrapper">
      <!-- TOP BAR -->
      <header class="top-bar">
        <div class="search-box">
          <input type="text" id="globalSearchInput" class="search-input" placeholder="Episode, character or writer">
          <button id="globalSearchBtn" class="search-btn">Search</button>
        </div>

        <div class="top-actions">
          <button id="themeToggle" class="theme-toggle-btn" title="Toggle Dark/Light Mode" aria-label="Toggle theme">
            <!-- Default Moon Icon SVG -->
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
            </svg>
          </button>
          <a href="/" class="brand-logo">
            <span class="brand-sans">THE</span>
            <span class="brand-serif">mentalist</span>
          </a>
        </div>
      </header>

      <!-- PAGE CONTENT -->
      <main class="page-container">
        {% block content %}{% endblock %}

        <footer class="app-footer">
          <div>
            © 2026 The Mentalist Analytics · <a href="/about">About</a> · <a href="/contact">Contact</a>
          </div>
          <div class="databricks-badge">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="#C8102E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Built on Databricks
          </div>
        </footer>
      </main>
    </div>
  </div>

  <!-- Floating Toast Feedback Element -->
  <div id="actionToast" class="action-toast">
    <span class="toast-dot"></span>
    <span id="toastMessage">Action completed</span>
  </div>

  <script src="/static/js/main.js"></script>
</body>
</html>
