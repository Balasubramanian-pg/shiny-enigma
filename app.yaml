version: 1
name: "mentalist-explorer"
description: "Editorial analytics app for The Mentalist running on Databricks Apps and Unity Catalog"
command:
  - "uvicorn"
  - "app.main:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"
env:
  - name: "DATABRICKS_CATALOG"
    value: "main"
  - name: "DATABRICKS_SCHEMA"
    value: "tvshows"
  - name: "SHOW_ID"
    value: "the_mentalist"
